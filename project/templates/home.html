<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bataille Corse — Accueil</title>
</head>
<body>
  <h1>Bataille Corse</h1>
  {% if user.is_authenticated %}
    <p>Connecté en tant que {{ user.username }} — <a href="{% url 'logout' %}">Se déconnecter</a></p>
    <ul>
      <li><a href="{% url 'create_room' %}">Créer une salle</a></li>
      <li><a href="{% url 'join_room' %}">Rejoindre une salle</a></li>
    </ul>
  {% else %}
    <p><a href="{% url 'login' %}">Se connecter</a> ou <a href="{% url 'signup' %}">Créer un compte</a></p>
  {% endif %}
</body>
</html>
