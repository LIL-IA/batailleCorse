{% extends "base.html" %}
{% block content %}
<h1>Bataille Corse</h1>
{% if user.is_authenticated %}
  <p>Connecté en tant que {{ user.username }} —
    <form action="{% url 'logout' %}" method="post" style="display:inline;">
      {% csrf_token %}
      <button type="submit">Se déconnecter</button>
    </form>
  </p>
  <ul>
    <li><a href="{% url 'create_room' %}">Créer une salle</a></li>
    <li><a href="{% url 'join_room' %}">Rejoindre une salle</a></li>
  </ul>
{% else %}
  <p><a href="{% url 'login' %}">Se connecter</a> ou <a href="{% url 'signup' %}">Créer un compte</a></p>
{% endif %}
{% endblock %}
