{% extends "base.html" %}
{% block content %}
<h2>Salle {{ room.code }}</h2>
<p>Joueurs :</p>
<ul id="players">
  {% for p in players %}
    <li data-user-id="{{ p.user.id }}">
      <strong>{{ p.user.username }}</strong> :
      <span class="status">en attente</span>
      <button class="ready-btn" onclick="wsSend({type:'ready', value:true})" {% if p.user != request.user %}disabled{% endif %}>Se déclarer prêt</button>
    </li>
  {% endfor %}
</ul>

{% if is_host %}
<button class="action-btn" onclick="wsSend({type:'start'})">Démarrer une partie</button>
{% endif %}
<button class="action-btn" onclick="wsSend({type:'play'})">Jouer une carte</button>
<button class="action-btn" onclick="wsSend({type:'slap'})">TAPER !</button>

<div id="error-message" style="color:red"></div>
<pre id="state"></pre>
<p><a href="/">Accueil</a></p>

<script>
  const errorMessages = {
      "not-ready": "Tous les joueurs doivent être prêts.",
      "not-enough-players": "Il faut au moins deux joueurs.",
      "start-failed": "Erreur lors du démarrage."
  };
  const roomCode = "{{ room.code|escapejs }}";
  const currentUserId = {{ request.user.id }};
  const wsScheme = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${wsScheme}://${location.host}/ws/room/${roomCode}/`);
  const errorDiv = document.getElementById("error-message");

  socket.onopen = () => console.log("WS ouvert");
  socket.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.error) {
      const err = errorMessages[msg.error] || msg.error;
      alert(err);
      if (errorDiv) {
        errorDiv.textContent = err;
      }
      document.querySelectorAll('.action-btn').forEach(btn => {
        btn.disabled = true;
        setTimeout(() => (btn.disabled = false), 1000);
      });
      return;
    }
    if (msg.type === "state") {
      document.querySelectorAll('.action-btn').forEach(btn => (btn.disabled = false));
      document.getElementById("state").textContent = JSON.stringify(msg.state, null, 2);
      const ready = msg.ready || [];
      document.querySelectorAll('#players li').forEach(li => {
        const uid = parseInt(li.dataset.userId, 10);
        const status = li.querySelector('.status');
        status.textContent = ready.includes(uid) ? 'prêt' : 'en attente';
        const btn = li.querySelector('.ready-btn');
        if (btn && uid === currentUserId) {
          btn.disabled = ready.includes(uid);
        }
      });
    }
  };
  socket.onclose = () => console.log("WS fermé");
  function wsSend(obj){ socket.send(JSON.stringify(obj)); }
</script>
{% endblock %}
